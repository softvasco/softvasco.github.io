---
layout: default
---
<article>
  <header class="hero">
    {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
      {% if page.repo %} · <a href="https://github.com/softvasco/{{ page.repo }}">{{ page.repo }}</a>{% endif %}
    </p>
  </header>
  {{ content }}
</article>
<p class="back"><a href="{{ '/' | relative_url }}">All posts</a></p>

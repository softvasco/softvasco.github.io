---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
    {% if page.repo %} · code in <a href="https://github.com/softvasco/{{ page.repo }}">{{ page.repo }}</a>{% endif %}
  </p>
  {{ content }}
</article>
<p class="back"><a href="{{ '/' | relative_url }}">All posts</a></p>

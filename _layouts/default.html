<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <div class="page">
    <aside class="side">
      <a class="name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p class="tag">{{ site.tagline }}</p>
      <nav>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="https://github.com/softvasco">GitHub</a>
        <a href="https://www.linkedin.com/in/softvasco">LinkedIn</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
      <div class="projects">
        <p class="label">Building</p>
        <a href="https://github.com/softvasco/ledger-core">ledger-core</a>
        <span>event-sourced double-entry ledger</span>
        <a href="https://github.com/softvasco/payee-match">payee-match</a>
        <span>fuzzy name matching</span>
      </div>
    </aside>
    <main>
      {{ content }}
      <footer class="site">
        <p>© {{ site.time | date: '%Y' }} Vasco Silva</p>
      </footer>
    </main>
  </div>
</body>
</html>
